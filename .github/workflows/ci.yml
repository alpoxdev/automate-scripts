name: CI

on:
  push:
    branches:
      - deploy/prod
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve next version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != "refs/heads/deploy/prod" ]; then
            echo "tag=v0.0.0-dev" >> "$GITHUB_OUTPUT"
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Using development package version for non-release workflow."
            exit 0
          fi

          existing_head_tag="$(git tag --points-at "$GITHUB_SHA" --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)"
          if [ -n "$existing_head_tag" ]; then
            echo "tag=$existing_head_tag" >> "$GITHUB_OUTPUT"
            echo "version=${existing_head_tag#v}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Using existing tag on HEAD: $existing_head_tag"
            exit 0
          fi

          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)"
          if [ -z "$latest_tag" ]; then
            next_tag="v0.1.0"
          else
            version="${latest_tag#v}"
            IFS='.' read -r major minor patch <<< "$version"
            next_tag="v${major}.${minor}.$((patch + 1))"
          fi

          echo "tag=$next_tag" >> "$GITHUB_OUTPUT"
          echo "version=${next_tag#v}" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $next_tag"

  swift:
    name: Build, test, and package ${{ matrix.suffix }} DMG
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: arm64
            runner: macos-15
          - suffix: x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Test
        run: swift test

      - name: Build CLI
        run: swift build -c release --product automate

      - name: Build menu bar app
        run: swift build -c release --product AutomateMenuBarApp

      - name: Package DMG
        shell: bash
        env:
          ARCH_SUFFIX: ${{ matrix.suffix }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail

          bin_path="$(swift build -c release --show-bin-path)"
          staging="dist/dmg-root"
          app="$staging/Automate Scripts.app"
          dmg_name="AutomateScripts-${RELEASE_TAG}-macos-${ARCH_SUFFIX}.dmg"
          build_number="${GITHUB_RUN_NUMBER:-1}"

          rm -rf dist
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" "$staging/bin"

          cp "$bin_path/AutomateMenuBarApp" "$app/Contents/MacOS/AutomateMenuBarApp"
          cp "$bin_path/automate" "$staging/bin/automate"
          chmod +x "$app/Contents/MacOS/AutomateMenuBarApp" "$staging/bin/automate"

          if [ -d "$bin_path/AutomateScripts_AutomateMenuBarApp.bundle" ]; then
            cp -R "$bin_path/AutomateScripts_AutomateMenuBarApp.bundle/"* "$app/Contents/Resources/"
          fi

          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>AutomateMenuBarApp</string>
            <key>CFBundleIconFile</key>
            <string>AutomateScripts</string>
            <key>CFBundleIdentifier</key>
            <string>com.alpox.AutomateScripts</string>
            <key>CFBundleName</key>
            <string>Automate Scripts</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${APP_VERSION}</string>
            <key>CFBundleVersion</key>
            <string>${build_number}</string>
            <key>LSMinimumSystemVersion</key>
            <string>13.0</string>
            <key>LSUIElement</key>
            <true/>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST

          cat > "$staging/README-INSTALL.txt" <<'TXT'
          Automate Scripts

          Install the menu bar app:
          1. Drag "Automate Scripts.app" to /Applications.
          2. Open it from /Applications.

          Install the CLI manually:
          sudo cp bin/automate /usr/local/bin/automate

          These early builds are ad-hoc signed and may show macOS Gatekeeper warnings.
          TXT

          codesign --force --deep --sign - "$app"

          mkdir -p dist/release
          hdiutil create \
            -volname "Automate Scripts" \
            -srcfolder "$staging" \
            -ov \
            -format UDZO \
            "dist/release/${dmg_name}"
          (cd dist/release && shasum -a 256 "${dmg_name}" > "${dmg_name}.sha256")

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-dmg-${{ matrix.suffix }}
          path: |
            dist/release/AutomateScripts-${{ needs.version.outputs.tag }}-macos-${{ matrix.suffix }}.dmg
            dist/release/AutomateScripts-${{ needs.version.outputs.tag }}-macos-${{ matrix.suffix }}.dmg.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs:
      - version
      - swift
    runs-on: ubuntu-latest
    if: needs.version.outputs.release == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download DMG artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-dmg-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          find dist -type f -maxdepth 1 \( -name '*.dmg' -o -name '*.sha256' \) -print -exec ls -lh {} \;

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            tag_target="$(git rev-list -n 1 "$TAG")"
            if [ "$tag_target" != "$GITHUB_SHA" ]; then
              echo "Tag $TAG already exists at $tag_target, not $GITHUB_SHA" >&2
              exit 1
            fi
            echo "Using existing tag on HEAD: $TAG"
          else
            git tag -a "$TAG" -m "Release $TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists for $TAG; uploading DMG assets."
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Automate Scripts $TAG" \
              --generate-notes
          fi

          gh release upload "$TAG" dist/*.dmg dist/*.sha256 --clobber
